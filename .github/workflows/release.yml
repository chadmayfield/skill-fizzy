name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Check the tag
        id: guard
        run: |
          git fetch origin main
          echo "kind=$(sh scripts/release-guard.sh)" >> "$GITHUB_OUTPUT"
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build archives
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.guard.outputs.kind }}
        run: |
          flag=""
          if [ "$KIND" = prerelease ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes $flag
