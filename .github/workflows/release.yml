name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # fetch-depth 0 fetches every branch, so origin/main is there for the
      # tag check without a second fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No Go cache: the release builds with empty module and build caches,
      # so nothing another workflow run saved can reach the archives.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag
        id: guard
        run: sh scripts/release-guard.sh
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build archives
        run: make dist VERSION="${GITHUB_REF_NAME}"
      # Attestations on a private repo may need a paid plan, which is not
      # confirmed. Skip them until the repo is public, so a tag still releases.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.guard.outputs.kind }}
        run: |
          if [ "$KIND" != release ] && [ "$KIND" != prerelease ]; then
            echo "tag check did not set kind to release or prerelease" >&2
            exit 1
          fi
          flag=""
          if [ "$KIND" = prerelease ]; then flag="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes $flag
